<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="text-to-type-container">
        <div id="text-to-type"></div>
    </div>
    <div id="controls"> <!-- New container for controls -->
        <button id="customTextBtn">Use Custom Text</button>
        <button id="saveTextBtn">Save Current Text</button> <!-- New Button -->
    </div>
    <div id="virtual-keyboard"></div>

    <!-- After <div id="virtual-keyboard"></div> -->
    <div id="savedTextsSection">
        <h2>Saved Practice Texts</h2>
        <div id="savedTextsContainer">
            <!-- Saved text cards will be dynamically added here by JavaScript -->
            <p id="noSavedTextsMsg">No texts saved yet.</p> <!-- Placeholder message -->
        </div>
    </div>

    <!-- Modal Structure (add before closing </body> tag) -->
    <div id="customTextModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="closeModalBtn" class="close-button">&times;</span>
            <h2>Enter Custom Text</h2>
            <textarea id="customTextArea" rows="10" style="width: 95%;"></textarea>
            <button id="submitCustomTextBtn">Start Practice with this Text</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
